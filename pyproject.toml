[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visaebench"
dynamic = ["version"]
description = "A benchmark for evaluating Sparse Autoencoders (SAEs) on Vision Transformers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "transformers>=4.36",
    "timm>=1.0",
    "pillow",
    "numpy",
    "scikit-learn>=1.3",
    "huggingface-hub>=0.20",
]

[project.urls]
Homepage = "https://github.com/visaebench/visaebench"
Repository = "https://github.com/visaebench/visaebench"

[tool.setuptools.dynamic]
version = {attr = "visaebench.version.__version__"}

[tool.setuptools.packages.find]
include = ["visaebench*"]
