[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visaebench"
dynamic = ["version"]
description = "A benchmark for evaluating Sparse Autoencoders (SAEs) on Vision Transformers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "torchvision",
    "transformers>=4.36",
    "timm>=1.0",
    "pillow",
    "numpy",
    "scikit-learn>=1.3",
    "huggingface-hub>=0.20",
    "datasets>=2.14",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/vraj130/visaebench"
Repository = "https://github.com/vraj130/visaebench"

[tool.setuptools.dynamic]
version = {attr = "visaebench.version.__version__"}

[tool.setuptools.packages.find]
include = ["visaebench*"]

[tool.setuptools.package-data]
visaebench = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not network'"
markers = [
    "gpu: marks tests that require a GPU",
    "network: marks tests that require network access",
]
